[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-screening-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "pymupdf>=1.24"]

[project.optional-dependencies]
extractors = ["pdfminer.six", "pypdf"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["harness*"]
