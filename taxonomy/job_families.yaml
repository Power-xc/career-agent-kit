# 직군(job family) 택소노미
# group: 직군 묶음 (design, dev, data, planning, marketing, sales, hr, finance, ops, commerce). rules/scoring.yaml의 family_weights가 묶음 단위로 점수 배분을 바꾼다
# titles: 타이틀 정규화용 표기이자 별칭 (대소문자·공백 무시). labels는 대표 이름(ko/en)
# seniority_words: 이 직군 직함에서 쓰이는 직급어 (공통 직급어는 seniority_levels)
# signals: 본문에서 그 직군을 암시하는 용어. family 명령이 비중을 계산한다
# core_skills: skills.yaml 개념 id. 서류에 나오면 직군 신호에 가산된다 (rules/scoring.yaml classification.core_skill_weight)
# decisive_evidence: 이 직군 심사에서 결정적인 근거. 서류에 있는지 score 결과의 family_evidence로 알린다 (label + 찾을 용어)
# portfolio_expected: false면 포트폴리오 감사 감점을 점수에 반영하지 않는다 (없으면 true)
# platform_labels: 채용 플랫폼의 직무 분류 이름 (조사 결과로 채운다. null = 미확인)
seniority_levels:
  intern: ["Intern", "인턴"]
  junior: ["Junior", "Jr.", "주니어", "신입", "사원"]
  mid: ["Mid-level", "미들", "대리", "주임"]
  senior: ["Senior", "Sr.", "시니어", "과장", "차장", "책임"]
  lead: ["Lead", "Staff", "Principal", "Manager", "Head", "Director", "VP", "리드", "팀장", "파트장", "매니저", "수석", "부장", "실장", "본부장"]
