<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"><style>
body{width:1280px;height:640px;position:relative;overflow:hidden}
.glow{position:absolute;right:-180px;top:-200px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,#FFD84D26,transparent 65%)}
.wrap{position:absolute;left:96px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:900px}
.tag{font-family:Inter;font-weight:600;font-size:22px;color:var(--accent);letter-spacing:.02em;display:flex;align-items:center;gap:12px}
.tag b{width:28px;height:28px;border-radius:7px;background:var(--accent);display:block;transform:rotate(-6deg)}
h1{font-size:84px;line-height:1.12;font-weight:800;letter-spacing:-.03em;margin:24px 0 18px}
h1 em{font-style:normal;color:var(--accent)}
p{font-size:34px;color:var(--muted);font-weight:500;letter-spacing:-.01em;margin-bottom:40px}
.chips{display:flex;gap:12px;font-size:21px}
.memo{position:absolute;right:96px;top:150px;width:230px;height:300px;background:var(--accent);border-radius:10px;transform:rotate(5deg);box-shadow:0 30px 60px #0008;padding:34px 28px}
.memo span{display:block;height:12px;border-radius:6px;background:#16140F;opacity:.85;margin-bottom:20px}
.memo span:nth-child(2){width:70%;opacity:.5}.memo span:nth-child(3){width:85%;opacity:.5}.memo span:nth-child(4){width:50%;opacity:.5}
.memo .ck{position:absolute;right:26px;bottom:26px;font-size:64px;font-weight:800;color:#16140F;font-family:Inter}
</style></head><body><div class="glow"></div>
<div class="wrap"><div class="tag"><b></b>career-agent-kit</div>
<h1>AI가 잘 읽게<br><em>고쳐 주는 하네스</em></h1>
<p>AI 서류 심사 하네스 · 32개 직군</p>
<div class="chips"><span class="chip"><i></i>딥리서치</span><span class="chip"><i></i>사실만 맞춤</span><span class="chip"><i></i>3중 심사 시뮬레이션</span><span class="chip"><i></i>32개 직군</span></div></div>
<div class="memo"><span></span><span></span><span></span><span></span><span style="width:60%;opacity:.5"></span><div class="ck">✓</div></div>
</body></html>
